<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Desk Duel</title>
<style>
  /* Agrandir Grand is a commercial font, so it can't be bundled here.
     It loads if it is installed on the device, or if you drop the files into a "fonts" folder next to this file.
     Otherwise the browser falls back to a similar wide geometric sans. */
  @font-face{
    font-family:"Agrandir Grand";font-weight:400;font-style:normal;
    src:local("Agrandir Grand"),local("Agrandir Grand Regular"),local("AgrandirGrand-Regular"),local("Agrandir-GrandRegular"),
        url("fonts/AgrandirGrand-Regular.woff2") format("woff2"),url("fonts/AgrandirGrand-Regular.otf") format("opentype");
  }
  @font-face{
    font-family:"Agrandir Grand";font-weight:700;font-style:normal;
    src:local("Agrandir Grand Bold"),local("AgrandirGrand-Bold"),local("Agrandir-GrandBold"),
        url("fonts/AgrandirGrand-Bold.woff2") format("woff2"),url("fonts/AgrandirGrand-Bold.otf") format("opentype");
  }
  :root{
    --ink:#1b3fae; --red:#d02a22;
    --font:"Agrandir Grand","Avenir Next","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#27231f;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    font-family:var(--font);font-weight:400;
  }
  canvas{position:fixed;inset:0;display:block;touch-action:none}
  #menuBtn{
    position:fixed;top:8px;left:8px;width:42px;height:42px;border-radius:50%;z-index:5;
    border:2px solid rgba(255,255,255,.25);background:rgba(20,14,10,.45);color:#f3ead6;font-size:20px;cursor:pointer;
  }
  .overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(15,10,6,.58);z-index:10;padding:12px;
  }
  .overlay[hidden]{display:none}
  .page{
    width:min(94vw,430px);max-height:96vh;overflow:auto;border-radius:6px;
    padding:14px 18px 20px 56px;color:var(--ink);
    background:
      linear-gradient(90deg,transparent 40px,#e0463f 40px,#e0463f 42px,transparent 42px),
      repeating-linear-gradient(#faf7eb 0 27px,#a5c3e8 27px 28px);
    box-shadow:0 18px 40px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.4) inset;
  }
  h1{margin:0;font-size:36px;line-height:56px;font-weight:700}
  .tag{margin:0 0 6px;font-size:15px;line-height:28px;font-weight:400;color:#33447f}
  .row{margin:4px 0 8px}
  .lbl{display:block;font-size:13px;line-height:28px;font-weight:400;color:#6b7a99}
  .seg{display:flex;flex-wrap:wrap;gap:2px 6px}
  .seg button{
    font:inherit;font-weight:400;font-size:15px;color:var(--ink);background:none;cursor:pointer;
    border:2px solid transparent;padding:4px 12px;min-height:40px;
  }
  .seg button.on{
    border-color:var(--red);
    border-radius:255px 18px 225px 18px/18px 225px 18px 255px;
  }
  .big{
    display:block;width:100%;margin:12px 0 0;font:inherit;font-weight:400;font-size:22px;color:var(--ink);
    background:rgba(255,255,255,.6);border:3px solid var(--ink);border-radius:8px 14px 10px 16px;
    min-height:58px;cursor:pointer;
  }
  .big.alt{font-size:17px;min-height:50px;border-color:#8896bd;color:#4d5d8f}
  .big[hidden]{display:none}
  .rules{margin:14px 0 0;padding-left:20px;font-size:14px;line-height:28px;font-weight:400;color:#33447f}
  .headline{font-size:26px;line-height:56px;font-weight:700;text-align:center;padding-right:8px}
  .rot{transform:rotate(180deg)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="menuBtn" aria-label="Menu">&#9776;</button>

<div id="menu" class="overlay">
  <div class="page">
    <h1>Desk Duel</h1>
    <p class="tag">Flick your pen. Knock theirs off the desk.</p>

    <div class="row">
      <span class="lbl">Players</span>
      <div class="seg" data-key="mode">
        <button data-v="2" class="on">Two on this phone</button>
        <button data-v="1">Vs computer</button>
      </div>
    </div>
    <div class="row" id="lvlRow" hidden>
      <span class="lbl">Computer level</span>
      <div class="seg" data-key="level">
        <button data-v="easy">Easy</button>
        <button data-v="normal" class="on">Normal</button>
        <button data-v="hard">Hard</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">First to</span>
      <div class="seg" data-key="target">
        <button data-v="3">3</button>
        <button data-v="5" class="on">5</button>
        <button data-v="7">7</button>
      </div>
    </div>

    <button id="startBtn" class="big">Start</button>
    <button id="resumeBtn" class="big alt" hidden>Resume</button>

    <ol class="rules">
      <li>Touch your pen, pull back, let go.</li>
      <li>Knock their pen off the desk to score.</li>
      <li>If your own pen falls off, they score.</li>
    </ol>
  </div>
</div>

<div id="over" class="overlay" hidden>
  <div class="page">
    <div class="headline rot" id="overTop"></div>
    <button id="againBtn" class="big">Play again</button>
    <button id="toMenuBtn" class="big alt">Change settings</button>
    <div class="headline" id="overBottom" style="margin-top:8px"></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const W = 640;
let H = 960;
const L = 170, R = 7, MASS = 1, INERTIA = 1.5 * L * L / 12;
const JMAX = 1100, MAXPULL = 100, DEADZONE = 8;
const KV = 1.5;          // viscous slide drag (1/s)
const MU = 100;          // dry friction deceleration (px/s^2), spread along the pen
const NF = 5, EPS = 8;   // friction sample points, smoothing speed
const KW = 2.5, MUW = 14; // extra spin damping so pens don't helicopter forever
const REST = 0.5, FRIC = 0.2;
const STEP = 1 / 240;
const FALL_T = 0.75;
const INK = ['#1b3fae', '#d02a22'];       // pen + paper colours
const INKUI = ['#7a9bff', '#ff7466'];     // brighter, readable on the dark desk
const CAP = ['#17369a', '#bd2119'];
const NAMES = ['Blue', 'Red'];
const FONT = '"Agrandir Grand","Avenir Next","Century Gothic","Trebuchet MS",system-ui,sans-serif';
const LEVELS = {
  easy:   { n: 20,  top: 6, ang: 0.22,  pw: 0.20 },
  normal: { n: 55,  top: 2, ang: 0.07,  pw: 0.07 },
  hard:   { n: 110, top: 1, ang: 0.025, pw: 0.03 }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- game state ---------- */
const settings = { mode: '2', level: 'normal', target: '5' };
const G = {
  state: 'menu', paused: false, cpu: false, level: 'normal', target: 5,
  score: [0, 0], turn: 0, pens: null, acc: 0, movingT: 0,
  toast: null, toastT: 0, aim: null, ai: null, flicked: false, nextFirst: 0, sndCool: 0, t: 0
};

/* ---------- physics ---------- */
function makePens() {
  const j = () => (Math.random() - 0.5) * 0.5;
  const mk = (x, y, a) => ({ x, y, a, vx: 0, vy: 0, w: 0, fall: -1, gone: false, snd: false });
  return [
    mk(W / 2 + (Math.random() - 0.5) * 140, H - 170, j()),
    mk(W / 2 + (Math.random() - 0.5) * 140, 170, Math.PI + j())
  ];
}

const tmp = {};
function segSeg(p1x, p1y, q1x, q1y, p2x, p2y, q2x, q2y, o) {
  const d1x = q1x - p1x, d1y = q1y - p1y, d2x = q2x - p2x, d2y = q2y - p2y;
  const rx = p1x - p2x, ry = p1y - p2y;
  const a = d1x * d1x + d1y * d1y, e = d2x * d2x + d2y * d2y;
  const f = d2x * rx + d2y * ry, c = d1x * rx + d1y * ry, b = d1x * d2x + d1y * d2y;
  const denom = a * e - b * b;
  let s = denom > 1e-9 ? clamp((b * f - c * e) / denom, 0, 1) : 0;
  let t = (b * s + f) / e;
  if (t < 0) { t = 0; s = clamp(-c / a, 0, 1); }
  else if (t > 1) { t = 1; s = clamp((b - c) / a, 0, 1); }
  o.ax = p1x + d1x * s; o.ay = p1y + d1y * s;
  o.bx = p2x + d2x * t; o.by = p2y + d2y * t;
}

function collide(A, B) {
  const ca = Math.cos(A.a), sa = Math.sin(A.a), cb = Math.cos(B.a), sb = Math.sin(B.a), h = L / 2;
  segSeg(A.x - ca * h, A.y - sa * h, A.x + ca * h, A.y + sa * h,
         B.x - cb * h, B.y - sb * h, B.x + cb * h, B.y + sb * h, tmp);
  let nx = tmp.bx - tmp.ax, ny = tmp.by - tmp.ay;
  let dist = Math.hypot(nx, ny);
  const minD = 2 * R;
  if (dist >= minD) return 0;
  if (dist < 1e-4) {
    nx = -sa; ny = ca;
    if (nx * (B.x - A.x) + ny * (B.y - A.y) < 0) { nx = -nx; ny = -ny; }
    dist = 0;
  } else { nx /= dist; ny /= dist; }
  const pen = minD - dist;
  const cx = (tmp.ax + tmp.bx) / 2, cy = (tmp.ay + tmp.by) / 2;
  const rax = cx - A.x, ray = cy - A.y, rbx = cx - B.x, rby = cy - B.y;
  A.x -= nx * pen * 0.4; A.y -= ny * pen * 0.4;
  B.x += nx * pen * 0.4; B.y += ny * pen * 0.4;
  let vax = A.vx - A.w * ray, vay = A.vy + A.w * rax;
  let vbx = B.vx - B.w * rby, vby = B.vy + B.w * rbx;
  let rvx = vbx - vax, rvy = vby - vay;
  const vn = rvx * nx + rvy * ny;
  if (vn >= 0) return 0;
  const iM = 1 / MASS;
  const raN = rax * ny - ray * nx, rbN = rbx * ny - rby * nx;
  const k = 2 * iM + raN * raN / INERTIA + rbN * rbN / INERTIA;
  const e = -vn < 80 ? 0.12 : REST;           // gentle taps don't bounce
  const j = -(1 + e) * vn / k;
  A.vx -= j * nx * iM; A.vy -= j * ny * iM; A.w -= raN * j / INERTIA;
  B.vx += j * nx * iM; B.vy += j * ny * iM; B.w += rbN * j / INERTIA;
  // contact friction (pens rub against each other)
  vax = A.vx - A.w * ray; vay = A.vy + A.w * rax;
  vbx = B.vx - B.w * rby; vby = B.vy + B.w * rbx;
  rvx = vbx - vax; rvy = vby - vay;
  const tx = -ny, ty = nx;
  const vt = rvx * tx + rvy * ty;
  const raT = rax * ty - ray * tx, rbT = rbx * ty - rby * tx;
  const kt = 2 * iM + raT * raT / INERTIA + rbT * rbT / INERTIA;
  const jt = clamp(-vt / kt, -FRIC * j, FRIC * j);
  A.vx -= jt * tx * iM; A.vy -= jt * ty * iM; A.w -= raT * jt / INERTIA;
  B.vx += jt * tx * iM; B.vy += jt * ty * iM; B.w += rbT * jt / INERTIA;
  return -vn;
}

function integrate(p, h) {
  p.x += p.vx * h; p.y += p.vy * h; p.a += p.w * h;
  if (p.fall >= 0) {                      // off the edge: coast, no desk friction
    const f = Math.exp(-0.4 * h);
    p.vx *= f; p.vy *= f; p.w *= f;
    return;
  }
  const kv = Math.exp(-KV * h);
  p.vx *= kv; p.vy *= kv; p.w *= Math.exp(-KW * h);
  // dry friction acts along the whole pen, so sliding and spinning drag on each other
  const c = Math.cos(p.a), s = Math.sin(p.a);
  let fx = 0, fy = 0, tq = 0;
  for (let k = 0; k < NF; k++) {
    const u = ((k + 0.5) / NF - 0.5) * L, rx = c * u, ry = s * u;
    const vx = p.vx - p.w * ry, vy = p.vy + p.w * rx;
    const sp = Math.hypot(vx, vy);
    if (sp < 1e-6) continue;
    const m = (MU / NF) / Math.max(sp, EPS);
    const ffx = -vx * m, ffy = -vy * m;
    fx += ffx; fy += ffy; tq += rx * ffy - ry * ffx;
  }
  p.vx += fx * h / MASS; p.vy += fy * h / MASS; p.w += tq * h / INERTIA;
  const aw = Math.abs(p.w);
  if (aw > 0) { const nw = aw - MUW * h; p.w = nw > 0 ? Math.sign(p.w) * nw : 0; }
  if (Math.hypot(p.vx, p.vy) + Math.abs(p.w) * L * 0.5 < 2.5) { p.vx = 0; p.vy = 0; p.w = 0; }
}

function step(pens, h) {
  for (const p of pens) {
    if (p.gone) continue;
    integrate(p, h);
    if (p.fall >= 0) { p.fall += h; if (p.fall > FALL_T) p.gone = true; }
    else if (p.x < 0 || p.x > W || p.y < 0 || p.y > H) p.fall = 0;
  }
  const A = pens[0], B = pens[1];
  if (!A.gone && !B.gone && A.fall < 0 && B.fall < 0) return collide(A, B);
  return 0;
}

function applyFlick(p, gx, gy, fx, fy) {
  p.vx += fx / MASS; p.vy += fy / MASS;
  p.w += ((gx - p.x) * fy - (gy - p.y) * fx) / INERTIA;
}

function atRest(p) { return p.vx === 0 && p.vy === 0 && p.w === 0; }
function settled(pens) { return pens.every(p => p.gone || (p.fall < 0 && atRest(p))); }

/* ---------- computer opponent ---------- */
function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function simulate(pens0, shooter, gx, gy, fx, fy) {
  const pens = [Object.assign({}, pens0[0]), Object.assign({}, pens0[1])];
  applyFlick(pens[shooter], gx, gy, fx, fy);
  for (let i = 0; i < 1100; i++) {
    step(pens, STEP);
    if (i % 12 === 11 && pens.every(p => p.fall >= 0 || p.gone || atRest(p))) break;
  }
  return pens;
}

function evalShot(res, me) {
  const op = 1 - me;
  const mg = res[me].fall >= 0, og = res[op].fall >= 0;
  if (og && !mg) return 1000;
  if (mg && !og) return -1000;
  if (mg && og) return -400;
  const marg = p => Math.min(p.x, W - p.x, p.y, H - p.y);
  return -marg(res[op]) + 1.2 * Math.min(marg(res[me]), 150);
}

function planAI() {
  const me = 1, cfg = LEVELS[G.level];
  const P = G.pens[me], Q = G.pens[0];
  const c = Math.cos(P.a), s = Math.sin(P.a);
  const cands = [];
  for (let i = 0; i < cfg.n; i++) {
    const d = Math.random() < 0.45 ? (Math.random() - 0.5) * 24 : (Math.random() * 2 - 1) * L * 0.4;
    const gx = P.x + c * d, gy = P.y + s * d;
    let tx, ty;
    if (Math.random() < 0.88) {
      const u = (Math.random() * 2 - 1) * L * 0.45;
      tx = Q.x + Math.cos(Q.a) * u; ty = Q.y + Math.sin(Q.a) * u;
    } else { tx = Math.random() * W; ty = Math.random() * H; }
    const ang = Math.atan2(ty - gy, tx - gx) + (Math.random() - 0.5) * 0.08;
    const pw = 0.4 + Math.random() * 0.6;
    const res = simulate(G.pens, me, gx, gy, Math.cos(ang) * pw * JMAX, Math.sin(ang) * pw * JMAX);
    cands.push({ sc: evalShot(res, me) + Math.random() * 4, gx, gy, ang, pw });
  }
  cands.sort((a, b) => b.sc - a.sc);
  const pick = cands[Math.floor(Math.random() * Math.min(cfg.top, cands.length))];
  return {
    gx: pick.gx, gy: pick.gy,
    ang: pick.ang + gauss() * cfg.ang,
    pw: clamp(pick.pw * (1 + gauss() * cfg.pw), 0.2, 1)
  };
}

/* ---------- audio ---------- */
let AC = null;
function audio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(freq, dur, type, vol, slideTo) {
  if (!AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sndHit = v => { const k = Math.min(1, v / 700); tone(900 + Math.random() * 200, 0.05, 'square', 0.02 + 0.04 * k, 350); tone(180, 0.09, 'sine', 0.03 + 0.05 * k); };
const sndFlick = () => tone(500, 0.07, 'triangle', 0.05, 200);
const sndFall = () => tone(420, 0.5, 'sine', 0.06, 90);
const sndPoint = () => { tone(523, .12, 'triangle', .07); setTimeout(() => tone(659, .12, 'triangle', .07), 110); setTimeout(() => tone(784, .22, 'triangle', .07), 220); };

/* ---------- flow ---------- */
const cpuTurn = () => G.cpu && G.turn === 1;
const nameOf = i => G.cpu ? (i === 0 ? 'You' : 'Computer') : NAMES[i];
const labelOf = i => G.cpu ? (i === 0 ? 'BLUE (YOU)' : 'RED (CPU)') : NAMES[i].toUpperCase();

function startMatch() {
  G.score = [0, 0]; G.flicked = false; G.paused = false;
  newRound(0);
}
function newRound(first) {
  G.pens = makePens(); G.turn = first; G.state = 'aim'; G.aim = null; G.ai = null; G.toast = null;
}
function flick(i, gx, gy, fx, fy) {
  applyFlick(G.pens[i], gx, gy, fx, fy);
  G.state = 'moving'; G.movingT = 0; G.acc = 0; G.flicked = true; G.aim = null; G.ai = null;
  sndFlick();
}
function resolve() {
  const g = G.pens.map(p => p.gone || p.fall >= 0);
  if (g[0] || g[1]) {
    if (g[0] && g[1]) {
      G.toast = { text: 'Both fell. No point.', who: -1 };
      G.nextFirst = 1 - G.turn;
    } else {
      const sc = g[0] ? 1 : 0;
      G.score[sc]++;
      G.toast = { text: nameOf(sc) + (G.cpu && sc === 0 ? ' score!' : ' scores!'), who: sc };
      G.nextFirst = 1 - sc;
      sndPoint();
    }
    G.state = 'scored'; G.toastT = 1.7;
  } else {
    G.turn = 1 - G.turn; G.state = 'aim'; G.ai = null;
  }
}
function afterScore() {
  const w = G.score[0] >= G.target ? 0 : G.score[1] >= G.target ? 1 : -1;
  if (w >= 0) showOver(w); else newRound(G.nextFirst);
}

function update(dt) {
  if (G.paused || G.state === 'menu' || G.state === 'over') return;
  G.t += dt; G.sndCool -= dt;
  if (G.state === 'aim') {
    if (cpuTurn()) updateAI(dt);
  } else if (G.state === 'moving') {
    G.acc += dt;
    let n = 0;
    while (G.acc >= STEP && n < 40) {
      const imp = step(G.pens, STEP);
      if (imp > 30 && G.sndCool <= 0) { sndHit(imp); G.sndCool = 0.06; }
      G.acc -= STEP; G.movingT += STEP; n++;
    }
    if (n >= 40) G.acc = 0;
    for (const p of G.pens) if (p.fall >= 0 && !p.snd) { p.snd = true; sndFall(); }
    if ((G.movingT > 0.35 && settled(G.pens)) || G.movingT > 10) resolve();
  } else if (G.state === 'scored') {
    G.toastT -= dt;
    if (G.toastT <= 0) afterScore();
  }
}

function updateAI(dt) {
  const ai = G.ai || (G.ai = { t: 0, plan: null, t0: 0 });
  ai.t += dt;
  if (!ai.plan && ai.t > 0.5) { ai.plan = planAI(); ai.t0 = ai.t; }
  if (ai.plan && (ai.t - ai.t0) / 0.85 >= 1) {
    const pl = ai.plan;
    flick(1, pl.gx, pl.gy, Math.cos(pl.ang) * pl.pw * JMAX, Math.sin(pl.ang) * pl.pw * JMAX);
  }
}

/* ---------- layout + textures ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let cssW, cssH, dpr, scale, offX, offY, desk, floorPat;

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function layout(recomputeH) {
  cssW = window.innerWidth; cssH = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  const m = 6, aw = cssW - 2 * m, ah = cssH - 2 * m;
  if (recomputeH) H = clamp(Math.round(W * ah / aw), 820, 1200);
  scale = Math.min(aw / W, ah / H);
  offX = (cssW - W * scale) / 2; offY = (cssH - H * scale) / 2;
  buildFloor(); buildDesk();
}

function buildFloor() {
  const f = document.createElement('canvas'); f.width = f.height = 180;
  const c = f.getContext('2d'), rnd = mulberry32(5);
  c.fillStyle = '#33363a'; c.fillRect(0, 0, 180, 180);
  for (let i = 0; i < 520; i++) {
    c.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,' + (0.02 + rnd() * 0.04) + ')' : 'rgba(0,0,0,' + (0.1 + rnd() * 0.15) + ')';
    const s = 1 + rnd() * 2; c.fillRect(rnd() * 180, rnd() * 180, s, s);
  }
  floorPat = ctx.createPattern(f, 'repeat');
}

function carve(c, fn) {
  c.save(); c.lineWidth = 2.6; c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(235,185,125,.3)'; c.translate(1.2, 1.2); fn(c); c.stroke();
  c.translate(-1.2, -1.2); c.strokeStyle = 'rgba(16,6,0,.7)'; fn(c); c.stroke();
  c.restore();
}
function carveText(c, txt, x, y, size, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.font = '700 ' + size + 'px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = 'rgba(235,185,125,.28)'; c.fillText(txt, 1.2, 1.2);
  c.fillStyle = 'rgba(16,6,0,.6)'; c.fillText(txt, 0, 0);
  c.restore();
}

function buildDesk() {
  const w = Math.max(1, Math.round(W * scale * dpr)), h = Math.max(1, Math.round(H * scale * dpr));
  desk = document.createElement('canvas'); desk.width = w; desk.height = h;
  const c = desk.getContext('2d'); c.scale(w / W, h / H);
  const rnd = mulberry32(23);
  c.save(); rr(c, 0, 0, W, H, 30); c.clip();

  // base: dark worn wood
  const g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#7e4d2a'); g.addColorStop(.5, '#6e4122'); g.addColorStop(1, '#5f3719');
  c.fillStyle = g; c.fillRect(0, 0, W, H);

  // planks
  const planks = 4;
  for (let i = 0; i < planks; i++) {
    c.fillStyle = i % 2 ? 'rgba(210,150,95,.07)' : 'rgba(25,10,2,.12)';
    c.fillRect(W * i / planks, 0, W / planks, H);
    if (i > 0) {
      const x = W * i / planks;
      c.fillStyle = 'rgba(12,5,0,.6)'; c.fillRect(x - 1.5, 0, 3, H);
      c.fillStyle = 'rgba(220,160,105,.16)'; c.fillRect(x + 1.5, 0, 1.5, H);
    }
  }
  // blotchy wear
  for (let i = 0; i < 70; i++) {
    const x = rnd() * W, y = rnd() * H, r = 40 + rnd() * 120, dark = rnd() < .55;
    const rg = c.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, dark ? 'rgba(25,10,2,.16)' : 'rgba(200,140,85,.09)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = rg; c.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  // grain
  for (let i = 0; i < 1800; i++) {
    const x = rnd() * W, y0 = rnd() * H, len = 60 + rnd() * 360, ph = rnd() * 6, amp = 0.8 + rnd() * 2.4;
    c.strokeStyle = rnd() < .65 ? 'rgba(25,10,2,' + (0.08 + rnd() * 0.16) + ')' : 'rgba(215,155,100,' + (0.04 + rnd() * 0.09) + ')';
    c.lineWidth = 0.5 + rnd() * 1.3;
    c.beginPath();
    for (let k = 0; k <= len; k += 12) {
      const xx = x + Math.sin(k * 0.03 + ph) * amp;
      if (k === 0) c.moveTo(xx, y0 + k); else c.lineTo(xx, y0 + k);
    }
    c.stroke();
  }
  // pores
  for (let i = 0; i < 2600; i++) {
    c.fillStyle = 'rgba(20,8,0,' + (0.1 + rnd() * 0.2) + ')';
    c.fillRect(rnd() * W, rnd() * H, 0.8 + rnd() * 1.2, 2 + rnd() * 7);
  }
  // knots
  for (let i = 0; i < 5; i++) {
    const x = rnd() * W, y = rnd() * H;
    for (let r = 3; r < 30; r += 4) {
      c.strokeStyle = 'rgba(15,6,0,' + (0.34 - r * 0.009) + ')'; c.lineWidth = 1.3;
      c.beginPath(); c.ellipse(x, y, r * 0.7, r * 1.5, 0, 0, 7); c.stroke();
    }
  }
  // cup rings + ink blotch
  c.strokeStyle = 'rgba(20,8,0,.3)'; c.lineWidth = 4;
  c.beginPath(); c.arc(W * 0.72, H * 0.34, 46, 0.3, 5.6); c.stroke();
  c.strokeStyle = 'rgba(20,8,0,.18)';
  c.beginPath(); c.arc(W * 0.72 + 20, H * 0.34 + 12, 46, 2.2, 7.4); c.stroke();
  c.fillStyle = 'rgba(25,40,110,.35)';
  c.beginPath(); c.ellipse(W * 0.3, H * 0.7, 14, 9, 0.5, 0, 7); c.fill();
  c.beginPath(); c.arc(W * 0.3 + 20, H * 0.7 + 12, 3.5, 0, 7); c.fill();

  // scratches
  for (let i = 0; i < 190; i++) {
    const x = rnd() * W, y = rnd() * H, a = rnd() * 6.28, l = 8 + rnd() * 55;
    c.strokeStyle = rnd() < .55 ? 'rgba(235,190,135,' + (0.18 + rnd() * 0.25) + ')' : 'rgba(15,6,0,' + (0.25 + rnd() * 0.25) + ')';
    c.lineWidth = .5 + rnd() * 1;
    c.beginPath(); c.moveTo(x, y);
    c.quadraticCurveTo(x + Math.cos(a) * l * .5 + rnd() * 5, y + Math.sin(a) * l * .5 + rnd() * 5, x + Math.cos(a) * l, y + Math.sin(a) * l);
    c.stroke();
  }
  // gouges
  for (let i = 0; i < 16; i++) {
    const x = rnd() * W, y = rnd() * H, a = rnd() * 6.28, l = 12 + rnd() * 26;
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(12,4,0,.5)'; c.lineWidth = 2.4 + rnd() * 1.6;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
    c.strokeStyle = 'rgba(235,185,125,.25)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + 1.5, y + 1.5); c.lineTo(x + Math.cos(a) * l + 1.5, y + Math.sin(a) * l + 1.5); c.stroke();
  }
  // pen-point dents
  for (let i = 0; i < 40; i++) {
    const x = rnd() * W, y = rnd() * H, r = 1 + rnd() * 2.2;
    c.fillStyle = 'rgba(12,4,0,.55)'; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    c.fillStyle = 'rgba(235,185,125,.22)'; c.beginPath(); c.arc(x + .8, y + .8, r * .6, 0, 7); c.fill();
  }

  /* ---- doodles ---- */
  // heart with arrow
  carve(c, k => {
    const x = W * 0.24, y = H * 0.4, s = 30;
    k.beginPath();
    k.moveTo(x, y + s * 0.55);
    k.bezierCurveTo(x - s * 1.2, y - s * 0.2, x - s * 0.6, y - s * 1.0, x, y - s * 0.35);
    k.bezierCurveTo(x + s * 0.6, y - s * 1.0, x + s * 1.2, y - s * 0.2, x, y + s * 0.55);
    k.moveTo(x - s * 1.6, y + s * 0.7); k.lineTo(x + s * 1.6, y - s * 0.7);
    k.moveTo(x + s * 1.6, y - s * 0.7); k.lineTo(x + s * 1.3, y - s * 0.75);
    k.moveTo(x + s * 1.6, y - s * 0.7); k.lineTo(x + s * 1.45, y - s * 0.4);
    k.moveTo(x - s * 1.6, y + s * 0.7); k.lineTo(x - s * 1.95, y + s * 0.6);
    k.moveTo(x - s * 1.6, y + s * 0.7); k.lineTo(x - s * 1.8, y + s * 1.0);
  });
  // tic-tac-toe
  carve(c, k => {
    const x0 = W * 0.64, y0 = H * 0.6, u = 26;
    k.beginPath();
    k.moveTo(x0 + u, y0); k.lineTo(x0 + u, y0 + 3 * u);
    k.moveTo(x0 + 2 * u, y0); k.lineTo(x0 + 2 * u, y0 + 3 * u);
    k.moveTo(x0, y0 + u); k.lineTo(x0 + 3 * u, y0 + u);
    k.moveTo(x0, y0 + 2 * u); k.lineTo(x0 + 3 * u, y0 + 2 * u);
    const X = (cx, cy) => { k.moveTo(cx - 7, cy - 7); k.lineTo(cx + 7, cy + 7); k.moveTo(cx + 7, cy - 7); k.lineTo(cx - 7, cy + 7); };
    X(x0 + u / 2, y0 + u / 2); X(x0 + 2.5 * u, y0 + u / 2); X(x0 + u / 2, y0 + 2.5 * u);
    k.moveTo(x0 + 1.5 * u + 8, y0 + 1.5 * u); k.arc(x0 + 1.5 * u, y0 + 1.5 * u, 8, 0, 6.3);
    k.moveTo(x0 + 2.5 * u + 8, y0 + 2.5 * u); k.arc(x0 + 2.5 * u, y0 + 2.5 * u, 8, 0, 6.3);
  });
  // star
  carve(c, k => {
    const x = W * 0.8, y = H * 0.27, r = 20;
    k.beginPath();
    for (let i = 0; i <= 5; i++) {
      const a = -Math.PI / 2 + i * 4 * Math.PI / 5;
      if (i === 0) k.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); else k.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
  });
  // smiley
  carve(c, k => {
    const x = W * 0.2, y = H * 0.62, r = 20;
    k.beginPath();
    k.moveTo(x + r, y); k.arc(x, y, r, 0, 6.3);
    k.moveTo(x - 7, y - 6); k.lineTo(x - 7, y - 3);
    k.moveTo(x + 7, y - 6); k.lineTo(x + 7, y - 3);
    k.moveTo(x - 10, y + 3); k.quadraticCurveTo(x, y + 14, x + 10, y + 3);
  });
  // spiral
  carve(c, k => {
    const x = W * 0.48, y = H * 0.27;
    k.beginPath();
    for (let t = 0; t < 18; t += 0.4) {
      const r = 1.2 * t, px = x + Math.cos(t) * r, py = y + Math.sin(t) * r;
      if (t === 0) k.moveTo(px, py); else k.lineTo(px, py);
    }
  });
  // football
  carve(c, k => {
    const x = W * 0.78, y = H * 0.76, r = 22;
    k.beginPath();
    k.moveTo(x + r, y); k.arc(x, y, r, 0, 6.3);
    for (let i = 0; i <= 5; i++) {
      const a = i * 2 * Math.PI / 5 - Math.PI / 2;
      if (i === 0) k.moveTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8); else k.lineTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8);
    }
    for (let i = 0; i < 5; i++) {
      const a = i * 2 * Math.PI / 5 - Math.PI / 2;
      k.moveTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8); k.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
  });
  // lightning bolt
  carve(c, k => {
    const x = W * 0.12, y = H * 0.2;
    k.beginPath();
    k.moveTo(x + 10, y - 26); k.lineTo(x - 8, y + 2); k.lineTo(x + 4, y + 2); k.lineTo(x - 10, y + 28);
    k.lineTo(x + 14, y - 6); k.lineTo(x + 2, y - 6); k.lineTo(x + 10, y - 26);
  });
  // old tally scratches
  carve(c, k => {
    const x0 = W * 0.84, y0 = H * 0.5;
    k.beginPath();
    for (let g2 = 0; g2 < 2; g2++) {
      const gx = x0 - g2 * 56;
      for (let i = 0; i < 4; i++) { k.moveTo(gx + i * 11, y0); k.lineTo(gx + i * 11 + (i % 2 ? 1 : -1), y0 + 34); }
      k.moveTo(gx - 6, y0 + 28); k.lineTo(gx + 40, y0 + 6);
    }
  });
  // scribble box
  carve(c, k => {
    const x = W * 0.38, y = H * 0.82;
    k.beginPath();
    k.moveTo(x, y); k.lineTo(x + 54, y + 3); k.lineTo(x + 52, y + 40); k.lineTo(x - 2, y + 38); k.lineTo(x + 1, y - 2);
    for (let i = 0; i < 6; i++) { k.moveTo(x + 4 + i * 9, y + 3); k.lineTo(x + 2 + i * 9, y + 36); }
  });
  carveText(c, 'SS3', W * 0.5, H * 0.46, 34, -0.12);
  carveText(c, 'FC', W * 0.3, H * 0.34, 26, 0.2);
  carveText(c, '2B', W * 0.86, H * 0.66, 22, -0.3);

  // ink dots
  for (let i = 0; i < 14; i++) {
    c.fillStyle = 'rgba(40,70,190,' + (0.3 + rnd() * 0.3) + ')';
    c.beginPath(); c.arc(rnd() * W, rnd() * H, 0.8 + rnd() * 1.8, 0, 7); c.fill();
  }

  // fine rough grit over everything
  const nz = document.createElement('canvas'); nz.width = nz.height = 128;
  const nc = nz.getContext('2d'), id = nc.createImageData(128, 128);
  for (let i = 0; i < 128 * 128; i++) {
    const v = Math.floor(rnd() * 255);
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;
  }
  nc.putImageData(id, 0, 0);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'overlay'; c.globalAlpha = 0.38;
  c.fillStyle = c.createPattern(nz, 'repeat'); c.fillRect(0, 0, w, h);
  c.restore();

  // pencil midline
  c.strokeStyle = 'rgba(215,205,190,.22)'; c.lineWidth = 2.2; c.setLineDash([14, 10]);
  c.beginPath(); c.moveTo(22, H / 2); c.lineTo(W - 22, H / 2); c.stroke();
  c.setLineDash([]);

  // worn rim + chips
  c.lineWidth = 20; c.strokeStyle = 'rgba(18,7,0,.55)'; rr(c, 0, 0, W, H, 30); c.stroke();
  c.lineWidth = 2; c.strokeStyle = 'rgba(235,185,125,.25)'; rr(c, 11, 11, W - 22, H - 22, 20); c.stroke();
  for (let i = 0; i < 60; i++) {
    const side = Math.floor(rnd() * 4), t = rnd();
    const x = side === 0 ? t * W : side === 1 ? W : side === 2 ? t * W : 0;
    const y = side === 0 ? 0 : side === 1 ? t * H : side === 2 ? H : t * H;
    c.fillStyle = 'rgba(10,4,0,.6)'; c.beginPath(); c.arc(x, y, 2 + rnd() * 5, 0, 7); c.fill();
  }
  c.restore();
}

/* ---------- drawing ---------- */
function drawPen(p, i) {
  const ink = INK[i], cap = CAP[i];
  const hl = L / 2, hw = R, capLen = L * 0.2, tipLen = L * 0.12;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
  let s = 1, al = 1;
  if (p.fall >= 0) { const t = Math.min(1, p.fall / FALL_T); s = 1 - 0.6 * t; al = 1 - t * t; }
  ctx.scale(s, s); ctx.globalAlpha = al;

  if (G.state === 'aim' && G.turn === i && !G.paused) {
    ctx.strokeStyle = INKUI[i]; ctx.globalAlpha = al * (0.4 + 0.3 * Math.sin(G.t * 5));
    ctx.lineWidth = 3; rr(ctx, -hl - 7, -hw - 7, L + 14, 2 * hw + 14, hw + 7); ctx.stroke();
    ctx.globalAlpha = al;
  }
  const bx = -hl + capLen * 0.7, bw = L - capLen * 0.7 - tipLen * 0.7;
  rr(ctx, bx, -hw, bw, 2 * hw, hw * 0.45);
  ctx.fillStyle = 'rgba(244,242,234,0.97)'; ctx.fill();
  const g = ctx.createLinearGradient(0, -hw, 0, hw);
  g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(.3, 'rgba(255,255,255,0)');
  g.addColorStop(.55, 'rgba(0,0,0,.07)'); g.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(30,30,30,.4)'; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.beginPath();
  ctx.moveTo(bx + 4, -hw * .45); ctx.lineTo(bx + bw - 4, -hw * .45);
  ctx.moveTo(bx + 4, hw * .45); ctx.lineTo(bx + bw - 4, hw * .45); ctx.stroke();
  ctx.strokeStyle = ink; ctx.globalAlpha = al * 0.9; ctx.lineWidth = 2.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-hl + capLen, 0); ctx.lineTo(hl - tipLen, 0); ctx.stroke();
  ctx.globalAlpha = al;
  rr(ctx, -hl, -hw * 1.12, capLen, hw * 2.24, hw * 0.55);
  ctx.fillStyle = cap; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(ctx, -hl + 3, -hw, capLen - 6, hw * 0.6, 3); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hl - tipLen, -hw * 0.7); ctx.lineTo(hl - 4, -1.8); ctx.lineTo(hl - 4, 1.8); ctx.lineTo(hl - tipLen, hw * 0.7);
  ctx.closePath(); ctx.fillStyle = cap; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8c8f94'; ctx.beginPath(); ctx.arc(hl - 2.5, 0, 2.2, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(bx + 8, -hw * .62); ctx.lineTo(bx + bw - 8, -hw * .62); ctx.stroke();
  ctx.restore();
}

function drawShadows() {
  ctx.save(); rr(ctx, 0, 0, W, H, 30); ctx.clip();
  ctx.fillStyle = 'rgba(10,4,0,.42)';
  for (const p of G.pens) {
    if (p.gone) continue;
    const a = p.fall >= 0 ? Math.max(0, 1 - p.fall / FALL_T * 1.6) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x + 4, p.y + 6); ctx.rotate(p.a);
    rr(ctx, -L / 2, -R, L, 2 * R, R); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

function drawTally(n, x, y, h, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.globalAlpha = 0.92;
  let cx = x;
  for (let g = 0; g * 5 < n; g++) {
    const k = Math.min(5, n - g * 5), strokes = Math.min(k, 4);
    for (let i = 0; i < strokes; i++) {
      const jx = (((g * 5 + i) * 37) % 7 - 3) * 0.6;
      ctx.beginPath(); ctx.moveTo(cx + i * 13 + jx, y + (i % 2)); ctx.lineTo(cx + i * 13 + jx * 0.5, y + h); ctx.stroke();
    }
    if (k === 5) { ctx.beginPath(); ctx.moveTo(cx - 6, y + h * 0.8); ctx.lineTo(cx + 3 * 13 + 6, y + h * 0.2); ctx.stroke(); }
    cx += 4 * 13 + 18;
  }
  ctx.restore();
}

function drawSide(i, ly, ty) {
  const active = G.state === 'aim' && G.turn === i;
  ctx.save();
  ctx.fillStyle = INKUI[i]; ctx.textBaseline = 'alphabetic';
  ctx.font = '700 24px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText(labelOf(i), 36, ly);
  if (active) {
    ctx.font = '400 17px ' + FONT; ctx.textAlign = 'right'; ctx.globalAlpha = 0.9;
    ctx.fillText(G.cpu && i === 1 ? 'Thinking...' : 'Your flick', W - 36, ly);
  }
  ctx.restore();
  drawTally(G.score[i], 38, ty, 40, INKUI[i]);
}

function drawAim(gx, gy, fx, fy, ink) {
  const dx = fx - gx, dy = fy - gy, len = Math.hypot(dx, dy);
  if (len < 1) return;
  const pull = Math.min(len, MAXPULL), ux = dx / len, uy = dy / len;
  const bx = gx + ux * pull, by = gy + uy * pull, pw = pull / MAXPULL;
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = ink; ctx.globalAlpha = 0.85; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(bx, by); ctx.stroke();
  ctx.globalAlpha = 0.35; ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(bx, by, 16, 0, 7); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(gx, gy, 4, 0, 7); ctx.fill(); ctx.stroke();
  if (len >= DEADZONE) {
    const al = 22 + pw * 80, ex = gx - ux * al, ey = gy - uy * al;
    ctx.globalAlpha = 0.4 + 0.55 * pw; ctx.lineWidth = 3.5 + pw * 2.5; ctx.setLineDash([2, 10]);
    ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]);
    const ah = 11 + pw * 6, ang = Math.atan2(-uy, -ux);
    ctx.beginPath();
    ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(ang - 0.5) * ah, ey - Math.sin(ang - 0.5) * ah);
    ctx.moveTo(ex, ey); ctx.lineTo(ex - Math.cos(ang + 0.5) * ah, ey - Math.sin(ang + 0.5) * ah);
    ctx.stroke();
  }
  ctx.restore();
}

function drawToast() {
  const T = G.toast; if (!T) return;
  const k = Math.min(1, (1.7 - G.toastT) / 0.18);
  ctx.font = '700 26px ' + FONT;
  const pw = Math.max(300, ctx.measureText(T.text).width + 70);
  for (const flip of [false, true]) {
    if (flip && G.cpu) continue;
    ctx.save();
    ctx.translate(W / 2, H / 2); if (flip) ctx.rotate(Math.PI);
    ctx.translate(0, 80); ctx.rotate(flip ? 0.02 : -0.025);
    const s = 0.85 + 0.15 * k; ctx.scale(s, s); ctx.globalAlpha = k;
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 10 * dpr * scale; ctx.shadowOffsetY = 4 * dpr * scale;
    ctx.fillStyle = '#f7f2df'; ctx.fillRect(-pw / 2, -36, pw, 72);
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = T.who >= 0 ? INK[T.who] : '#3a3a3a';
    ctx.font = '700 26px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(T.text, 0, 2);
    ctx.restore();
  }
}

function drawHint() {
  if (G.flicked || G.state !== 'aim' || cpuTurn()) return;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  if (G.turn === 1) ctx.rotate(Math.PI);
  ctx.fillStyle = 'rgba(255,238,210,.8)'; ctx.font = '400 17px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Touch your pen, pull back, let go.', 0, 52);
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = floorPat; ctx.fillRect(0, 0, cssW, cssH);
  ctx.save(); ctx.translate(offX, offY); ctx.scale(scale, scale);

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 26 * dpr * scale; ctx.shadowOffsetY = 10 * dpr * scale;
  ctx.drawImage(desk, 0, 0, W, H);
  ctx.restore();

  if (G.pens) drawShadows();

  if (G.state !== 'menu' || G.score[0] + G.score[1] > 0) {
    drawSide(0, H - 24, H - 98);
    if (G.cpu) drawSide(1, 106, 32);
    else { ctx.save(); ctx.translate(W, H); ctx.rotate(Math.PI); drawSide(1, H - 24, H - 98); ctx.restore(); }
    drawHint();
  }

  if (G.pens) for (let i = 0; i < 2; i++) if (!G.pens[i].gone) drawPen(G.pens[i], i);

  if (G.aim) drawAim(G.aim.gx, G.aim.gy, G.aim.px, G.aim.py, INKUI[G.turn]);
  if (G.state === 'aim' && G.ai && G.ai.plan) {
    const pl = G.ai.plan, p = clamp((G.ai.t - G.ai.t0) / 0.85, 0, 1), e = p * p * (3 - 2 * p);
    const pull = pl.pw * MAXPULL * e;
    drawAim(pl.gx, pl.gy, pl.gx - Math.cos(pl.ang) * pull, pl.gy - Math.sin(pl.ang) * pull, INKUI[1]);
  }
  if (G.state === 'scored') drawToast();
  ctx.restore();
}

/* ---------- input ---------- */
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }

cv.addEventListener('pointerdown', e => {
  audio();
  if (G.state !== 'aim' || G.paused || cpuTurn() || G.aim) return;
  const m = toLogical(e), p = G.pens[G.turn];
  const c = Math.cos(p.a), s = Math.sin(p.a);
  const u = clamp((m.x - p.x) * c + (m.y - p.y) * s, -L / 2, L / 2);
  const qx = p.x + c * u, qy = p.y + s * u;
  if (Math.hypot(m.x - qx, m.y - qy) > R + 30) return;
  G.aim = { id: e.pointerId, gx: qx, gy: qy, px: m.x, py: m.y };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!G.aim || e.pointerId !== G.aim.id) return;
  const m = toLogical(e); G.aim.px = m.x; G.aim.py = m.y;
});
function endAim(e, fire) {
  if (!G.aim || e.pointerId !== G.aim.id) return;
  const a = G.aim, dx = a.px - a.gx, dy = a.py - a.gy, len = Math.hypot(dx, dy);
  G.aim = null;
  if (!fire || len < DEADZONE) return;
  const pw = Math.min(len, MAXPULL) / MAXPULL;
  flick(G.turn, a.gx, a.gy, -dx / len * pw * JMAX, -dy / len * pw * JMAX);
}
cv.addEventListener('pointerup', e => endAim(e, true));
cv.addEventListener('pointercancel', e => endAim(e, false));
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- menu + overlays ---------- */
const $ = id => document.getElementById(id);
const menu = $('menu'), over = $('over');

function syncMenu() { $('lvlRow').hidden = settings.mode !== '1'; }
document.querySelectorAll('.seg').forEach(seg => {
  seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    settings[seg.dataset.key] = b.dataset.v; syncMenu();
  });
});

function showMenu() {
  G.aim = null;
  if (G.state === 'aim' || G.state === 'moving' || G.state === 'scored') G.paused = true;
  $('resumeBtn').hidden = !G.paused;
  over.hidden = true; menu.hidden = false;
}
function begin() {
  audio();
  G.cpu = settings.mode === '1'; G.level = settings.level; G.target = +settings.target;
  // keep the menu button clear of the scoreboard
  const b = $('menuBtn');
  if (G.cpu) { b.style.left = 'auto'; b.style.right = '8px'; } else { b.style.right = 'auto'; b.style.left = '8px'; }
  menu.hidden = true; over.hidden = true;
  layout(true);
  startMatch();
}
function showOver(w) {
  G.state = 'over';
  const s = G.score;
  const txt = G.cpu
    ? (w === 0 ? 'You win, ' : 'Computer wins, ') + Math.max(...s) + ' to ' + Math.min(...s)
    : NAMES[w] + ' wins ' + Math.max(...s) + ' to ' + Math.min(...s);
  $('overTop').textContent = txt; $('overTop').hidden = G.cpu;
  $('overBottom').textContent = txt;
  over.hidden = false;
}

$('startBtn').onclick = begin;
$('resumeBtn').onclick = () => { menu.hidden = true; G.paused = false; };
$('againBtn').onclick = begin;
$('toMenuBtn').onclick = () => { over.hidden = true; G.state = 'menu'; G.paused = false; $('resumeBtn').hidden = true; menu.hidden = false; };
$('menuBtn').onclick = showMenu;

/* ---------- boot ---------- */
let rzT = null;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => layout(false), 150); });

G.pens = makePens();
layout(true);
syncMenu();
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('400 16px "Agrandir Grand"'), document.fonts.load('700 16px "Agrandir Grand"')])
    .then(() => layout(false)).catch(() => {});
}

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
